# Produção — Chord Seven (mucifrar) na rede netsys.
# Pré-requisito: infra em /app/netsys-apps/docker-config (rede "netsys" + Postgres).
# Porta host: 8095 (evita colisão com ejc 8093/8094 e escolar 8090–8092).

name: mucifrar

networks:
  netsys:
    external: true
    name: netsys

services:
  api:
    build:
      context: .
      dockerfile: ../docker-config/images/api/Dockerfile
      args:
        BASE_IMAGE: netsys-node:20
        WORKSPACE: '@mucifrar/api'
        API_DIR: apps/api
        EXPOSE_PORT: '3003'
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: '3003'
      DATABASE_URL: postgresql://mucifrar:${MUCIFRAR_DB_PASSWORD}@postgres:5432/mucifrar
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Defina JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8095}
      APP_URL: ${APP_URL:-http://localhost:8095}
      RATE_LIMIT_API_MAX: ${RATE_LIMIT_API_MAX:-1000}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-30}
      RATE_LIMIT_PUBLIC_MAX: ${RATE_LIMIT_PUBLIC_MAX:-120}
    networks:
      - netsys
    expose:
      - '3003'

  web:
    build:
      context: .
      dockerfile: ../docker-config/images/web-nginx/Dockerfile
      args:
        BASE_IMAGE: netsys-node:20
        WEB_BASE_IMAGE: netsys-web-nginx:base
        WORKSPACE: '@mucifrar/web'
        WEB_DIR: apps/web
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:3003
    depends_on:
      - api
    networks:
      - netsys
    ports:
      - '${WEB_PORT:-8095}:80'
